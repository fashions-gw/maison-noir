<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Member - CASA MODA</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#f5f5f5;padding:16px}
.card{background:#fff;border-radius:16px;padding:20px;max-width:480px;margin:auto;box-shadow:0 4px 20px rgba(0,0,0,.08)}
h2{text-align:center}
input,button{width:100%;padding:12px;margin:8px 0;border-radius:10px;border:1px solid #ddd;font-size:15px}
button{background:#111;color:#fff;border:none;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6}
.foto-wrap{text-align:center;position:relative;width:120px;height:120px;margin:10px auto}
#fotoPreview{width:120px;height:120px;border-radius:50%;object-fit:cover;border:3px solid #111;background:#eee}
#btnFoto{position:absolute;bottom:0;right:0;width:36px;height:36px;border-radius:50%;padding:0;font-size:18px;background:#111}
.info{background:#f9f9f9;border-radius:12px;padding:12px;margin-top:10px;font-size:14px;line-height:1.8}
.badge{display:inline-block;background:#eee;padding:2px 10px;border-radius:20px;font-size:12px}
.hidden{display:none}
#status{text-align:center;font-size:13px;color:#666;min-height:18px}
</style>
</head>
<body>

<div class="card" id="loginCard">
  <h2>Login Member<br>CASA MODA</h2>
  <input id="loginWa" placeholder="No WA (contoh: 085890611111)">
  <input id="loginPass" type="password" placeholder="Password">
  <button onclick="login()">MASUK</button>
  <p id="status"></p>
  <p style="text-align:center;font-size:13px;color:#888">Belum punya akun? Daftar di kasir</p>
</div>

<div class="card hidden" id="profilCard">
  <h2>Profil Member</h2>
  <div class="foto-wrap">
    <img id="fotoPreview" src="https://via.placeholder.com/120?text=CASA">
    <button id="btnFoto" onclick="document.getElementById('inputFoto').click()">📸</button>
    <input type="file" id="inputFoto" accept="image/*" style="display:none" onchange="uploadFoto(this)">
  </div>
  <p id="status"></p>
  <div class="info" id="infoMember"></div>
  <button onclick="logout()" style="background:#eee;color:#111">KELUAR</button>
</div>

<script>
// ==== GANTI 2 INI PAKE PUNYA LU ====
const SUPABASE_URL = "https://URL-PROYEK-LU.supabase.co";
const SUPABASE_KEY = "ANON-KEY-LU";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let userSaatIni = null;

async function login(){
  const wa = document.getElementById('loginWa').value.trim();
  const pass = document.getElementById('loginPass').value.trim();
  if(!wa || !pass) return alert('Isi WA & Password dulu');
  document.getElementById('status').innerText = 'Mengecek...';
  const { data, error } = await supabase.from('member').select('*').eq('wa', wa).eq('password', pass).single();
  if(error || !data){ document.getElementById('status').innerText = 'WA / Password salah!'; return; }
  userSaatIni = data;
  localStorage.setItem('casa_member', JSON.stringify(data));
  tampilProfil();
}

function tampilProfil(){
  if(!userSaatIni) return;
  document.getElementById('loginCard').classList.add('hidden');
  document.getElementById('profilCard').classList.remove('hidden');
  // Foto: pake foto_url, kalau kosong pake foto lama, kalau kosong pake placeholder
  const foto = userSaatIni.foto_url || userSaatIni.foto || 'https://via.placeholder.com/120?text=CASA';
  document.getElementById('fotoPreview').src = foto;
  document.getElementById('infoMember').innerHTML = `
    <b>${userSaatIni.nama}</b> <span class="badge">${userSaatIni.tingkat || 'Member'}</span><br>
    📱 ${userSaatIni.wa}<br>
    🏠 ${userSaatIni.alamat || '-'} - ${userSaatIni.kota || ''}<br>
    💰 Saldo: Rp ${(userSaatIni.saldo||0).toLocaleString('id-ID')}<br>
    ⭐ Poin: ${userSaatIni.poin||0} | 🛍️ Total Belanja: Rp ${(userSaatIni.total_belanja||0).toLocaleString('id-ID')}
  `;
}

async function uploadFoto(input){
  const file = input.files[0];
  if(!file) return;
  if(!userSaatIni) return alert('Login dulu');
  document.getElementById('status').innerText = 'Uploading... Ke Database ☁️';
  const namaFile = `member-${userSaatIni.id}-${Date.now()}.jpg`;
  // 1. Upload ke bucket foto-profil
  const { error: upErr } = await supabase.storage.from('foto-profil').upload(namaFile, file, { upsert: true, contentType: file.type });
  if(upErr){ document.getElementById('status').innerText = 'Gagal upload: ' + upErr.message; return; }
  // 2. Ambil URL public-nya
  const { data: urlData } = supabase.storage.from('foto-profil').getPublicUrl(namaFile);
  const fotoUrl = urlData.publicUrl;
  // 3. Simpan URL ke tabel member
  const { error: dbErr } = await supabase.from('member').update({ foto_url: fotoUrl }).eq('id', userSaatIni.id);
  if(dbErr){ document.getElementById('status').innerText = 'Gagal simpan: ' + dbErr.message; return; }
  userSaatIni.foto_url = fotoUrl;
  localStorage.setItem('casa_member', JSON.stringify(userSaatIni));
  document.getElementById('fotoPreview').src = fotoUrl;
  document.getElementById('status').innerText = 'Foto tersimpan di Database! ☁️✅';
}

// Auto-login kalau udah pernah login
const saved = localStorage.getItem('casa_member');
if(saved){ userSaatIni = JSON.parse(saved); tampilProfil(); }

function logout(){ localStorage.removeItem('casa_member'); location.reload(); }
</script>
</body>
</html>
