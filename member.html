<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Member - CASA MODA</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Georgia',serif}
body{background:#000;color:#fff;overflow-x:hidden}
.hero{background:linear-gradient(rgba(0,0,0,0.45),rgba(0,0,0,0.65)),url('background-emas.jpg');background-size:cover;background-position:center top;padding:20px;text-align:center}
.logo{font-size:22px;letter-spacing:3px;font-weight:bold;text-align:left}.logo span{color:#FFD700;font-size:11px;display:block;letter-spacing:5px}
.section{padding:15px 20px 110px;background:linear-gradient(rgba(0,0,0,0.55),rgba(0,0,0,0.65)),url('background-emas.jpg');background-size:cover;background-position:center;min-height:100vh}
.card{background:rgba(0,0,0,0.55);border:1px solid rgba(255,215,0,0.6);border-radius:18px;padding:20px;max-width:480px;margin:auto;text-align:center}
h2{font-size:22px;text-align:center} h2 i{color:#FFD700}
input,button{width:100%;padding:12px;margin:8px 0;border-radius:10px;border:1px solid #444;background:#222;color:#fff;font-size:15px}
button{background:#FFD700;color:#000;border:none;font-weight:bold;cursor:pointer}
button.abu{background:#222;color:#fff;border:1px solid #FFD700}
.foto-wrap{text-align:center;position:relative;width:120px;height:120px;margin:14px auto}
#fotoPreview{width:120px;height:120px;border-radius:50%;object-fit:cover;border:3px solid #FFD700;background:#222}
#btnFoto{position:absolute;bottom:0;right:0;width:36px;height:36px;border-radius:50%;padding:0;font-size:18px;background:#FFD700}
.info{background:rgba(0,0,0,0.55);border:1px solid rgba(255,215,0,0.4);border-radius:12px;padding:14px;margin-top:10px;font-size:14px;line-height:1.9;text-align:left}
.badge{display:inline-block;background:#FFD700;color:#000;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:bold}
.hidden{display:none}
#status{text-align:center;font-size:13px;color:#FFD700;min-height:18px;word-break:break-word}
a{color:#FFD700}
</style>
</head>
<body>
<div class="hero"><div class="logo">CASA MODA<span>MEMBER LUXURY</span></div></div>
<div class="section">
<div class="card" id="loginCard">
  <h2>Login <i>Member</i><br>CASA MODA</h2>
  <input id="loginWa" placeholder="No WA (contoh: 085890611111)">
  <input id="loginPass" type="password" placeholder="Password">
  <button onclick="login()">MASUK</button>
  <p id="status"></p>
  <p style="text-align:center;font-size:13px;color:#ccc">Belum punya akun? Daftar di kasir<br><a href="index.html">← Kembali ke Katalog</a></p>
</div>
<div class="card hidden" id="profilCard">
  <h2>Profil <i>Member</i></h2>
  <div class="foto-wrap">
    <img id="fotoPreview" src="https://via.placeholder.com/120?text=CASA">
    <button id="btnFoto" onclick="document.getElementById('inputFoto').click()">📸</button>
    <input type="file" id="inputFoto" accept="image/*" style="display:none" onchange="uploadFoto(this)">
  </div>
  <p id="status2"></p>
  <div class="info" id="infoMember"></div>
  <button onclick="logout()" class="abu">KELUAR</button>
  <a href="index.html"><button class="abu" style="margin-top:4px">🛍️ Belanja Lagi</button></a>
</div>
</div>
<script>
const SUPABASE_URL = "https://tnpkepfjrltfryhuqnvo.supabase.co";
const SUPABASE_KEY = "sb_publishable_D_RB0mj9X66SOlj9-4jgug_s7fvHEYO";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let userSaatIni = null;

// Bikin semua versi WA: 0858..., 62858..., +62858...
function variasiWA(wa){
  let w = wa.replace(/[^0-9]/g,'');
  if(w.startsWith('62')) w = '0' + w.slice(2);
  if(!w.startsWith('0')) w = '0' + w;
  let v1 = w; // 0858...
  let v2 = '62' + w.slice(1); // 62858...
  let v3 = '+' + v2;
  return [...new Set([wa, v1, v2, v3])];
}

async function login(){
  const waRaw = document.getElementById('loginWa').value.trim();
  const pass = document.getElementById('loginPass').value.trim();
  if(!waRaw || !pass) return alert('Isi WA & Password dulu');
  document.getElementById('status').innerText = 'Mengecek...';
  let ketemu = null;
  let lastError = '';
  // Coba semua variasi WA
  for(let wa of variasiWA(waRaw)){
    let { data, error } = await supabase.from('member').select('*').eq('wa', wa).eq('password', pass).maybeSingle();
    if(data){ ketemu = data; break; }
    if(error) lastError = error.message;
  }
  // Kalau masih gak ketemu, coba tanpa password dulu buat cek apakah WA-nya ketemu tapi password salah
  if(!ketemu){
    for(let wa of variasiWA(waRaw)){
      let { data } = await supabase.from('member').select('*').eq('wa', wa).maybeSingle();
      if(data){
        document.getElementById('status').innerText = 'WA ketemu, tapi Password salah! Cek password di kasir. (WA di DB: '+data.wa+')';
        return;
      }
    }
    document.getElementById('status').innerText = 'WA / Password salah! ' + (lastError ? 'Error: '+lastError : 'Coba cek RLS di Supabase masih nyala atau tidak.');
    return;
  }
  userSaatIni = ketemu;
  localStorage.setItem('casa_member', JSON.stringify(ketemu));
  tampilProfil();
}
function tampilProfil(){
  if(!userSaatIni) return;
  document.getElementById('loginCard').classList.add('hidden');
  document.getElementById('profilCard').classList.remove('hidden');
  const foto = userSaatIni.foto_url || userSaatIni.foto || 'https://via.placeholder.com/120?text=CASA';
  document.getElementById('fotoPreview').src = foto;
  document.getElementById('infoMember').innerHTML = `
    <b>${userSaatIni.nama}</b> <span class="badge">${userSaatIni.tingkat || 'Member'}</span><br>
    📱 ${userSaatIni.wa}<br>
    🏠 ${userSaatIni.alamat || '-'} - ${userSaatIni.kota || ''}<br>
    💰 Saldo: <b style="color:#FFD700">Rp ${(userSaatIni.saldo||0).toLocaleString('id-ID')}</b><br>
    ⭐ Poin: ${userSaatIni.poin||0} | 🛍️ Total Belanja: Rp ${(userSaatIni.total_belanja||0).toLocaleString('id-ID')}
  `;
}
async function uploadFoto(input){
  const file = input.files[0];
  if(!file) return;
  if(!userSaatIni) return alert('Login dulu');
  document.getElementById('status2').innerText = 'Uploading...';
  const namaFile = `member-${userSaatIni.id}-${Date.now()}.jpg`;
  const { error: upErr } = await supabase.storage.from('foto-profil').upload(namaFile, file, { upsert: true, contentType: file.type });
  if(upErr){ document.getElementById('status2').innerText = 'Gagal upload: ' + upErr.message; return; }
  const { data: urlData } = supabase.storage.from('foto-profil').getPublicUrl(namaFile);
  const fotoUrl = urlData.publicUrl;
  const { error: dbErr } = await supabase.from('member').update({ foto_url: fotoUrl }).eq('id', userSaatIni.id);
  if(dbErr){ document.getElementById('status2').innerText = 'Gagal simpan: ' + dbErr.message; return; }
  userSaatIni.foto_url = fotoUrl;
  localStorage.setItem('casa_member', JSON.stringify(userSaatIni));
  document.getElementById('fotoPreview').src = fotoUrl;
  document.getElementById('status2').innerText = 'Foto tersimpan! ☁️✅';
}
const saved = localStorage.getItem('casa_member');
if(saved){ try{ userSaatIni = JSON.parse(saved); tampilProfil(); }catch(e){} }
function logout(){ localStorage.removeItem('casa_member'); location.reload(); }
</script>
</body>
</html>
